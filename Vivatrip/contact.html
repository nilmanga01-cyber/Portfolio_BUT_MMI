<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>VivaTrip - Contact</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="contact-section">
    <div class="contact-card">
        <h1>Contactez-nous</h1>
        <p class="contact-intro">
            Une question, un projet de voyage ou une demande personnalisée ?
            Notre équipe vous répond rapidement.
        </p>

        <form>
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" id="name" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="exemple@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Envoyer</button>
        </form>
    </div>
</section>
<footer>
        <p>&copy; 2025 Vivatrip. Tous droits réservés.</p>
    </footer>
</body>
</html>
